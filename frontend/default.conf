server {
    listen 80;
    server_name localhost;

    # Allow uploading large AI model files up to 500MB
    client_max_body_size 500M;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Critical for video streaming — disable buffering so range requests
        # (seek/scrub) are passed directly through without nginx buffering the whole file
        proxy_buffering off;
        proxy_request_buffering off;

        # Pass range request headers through (required for video seek)
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        # Timeouts
        proxy_connect_timeout   10s;
        proxy_send_timeout     120s;
        proxy_read_timeout     120s;
    }
}
